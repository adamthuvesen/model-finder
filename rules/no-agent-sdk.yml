id: no-agent-sdk
language: python
severity: error
message: "The native goal runs the agent, so scripts, tests, and skills must not call an agent SDK either. Fix: remove this import."
# ruff's banned-api covers the engine; these paths ignore TID251 because they start processes.
files:
  - scripts/**/*.py
  - tests/**/*.py
  - .agents/**/*.py
rule:
  any:
    - kind: import_statement
      has:
        stopBy: end
        kind: dotted_name
        regex: ^(anthropic|openai|litellm|langchain[a-z_]*|claude_agent_sdk|claude_code_sdk)(\.|$)
    - kind: import_from_statement
      has:
        field: module_name
        regex: ^(anthropic|openai|litellm|langchain[a-z_]*|claude_agent_sdk|claude_code_sdk)(\.|$)
