id: no-agent-runtime
language: python
severity: error
message: The native goal runs the agent. Ruff TID251 bans the imports; this catches dynamic ones.
files:
  - src/**/*.py
  - demos/**/*.py
rule:
  any:
    - pattern: __import__($$$)
    - all:
        - kind: call
        - has:
            field: function
            regex: (^|\.)import_module$
        - has:
            field: arguments
            has:
              kind: string
              regex: (subprocess|multiprocessing|anthropic|openai|claude|pty|asyncio)
