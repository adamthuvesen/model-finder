id: no-holdout-access-in-demos
language: python
severity: error
message: Demo code reaches no holdout rows. The engine scores them through score_rows after a freeze.
files:
  - demos/**/*.py
  - experiments/*/scripts/**/*.py
rule:
  any:
    - kind: attribute
      regex: \.(holdout|test|final_holdout|sealed_file_path|store_root)$
    - kind: identifier
      regex: ^(HoldoutSplits|load_sealed_holdout|include_holdout|sealed_file_path|store_root)$
    - kind: string
      regex: (holdouts|agentic-ml-loop|holdout\.parquet|^["']holdout["']$|^["']test["']$)
