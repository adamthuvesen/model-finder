[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251", "S101", "S108", "S603", "S607", "B010", "ANN", "ARG", "PLC0415", "SLF001", "FBT", "T20", "TRY", "PTH123"]
# Experiment code answers only to the banned imports (TID).
"experiments/**" = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE", "TRY", "PTH", "ANN", "PL", "RUF", "C4", "DTZ", "T20", "ARG", "ERA", "PERF", "FBT", "SLF", "RET", "PGH"]
"demos/**" = ["S", "BLE", "TRY", "PTH", "ANN", "PL", "RUF", "C4", "DTZ", "T20", "ARG", "ERA", "PERF", "FBT", "SLF", "RET", "PGH"]
# The command line is the one place that prints.
"src/model_finder/cli/*.py" = ["T201"]
"scripts/**" = ["S603", "S607", "TID251", "T201"]
".agents/skills/*/verify" = ["S603", "S607", "TID251", "T201"]
".agents/skills/*/drives.py" = ["S603", "S607", "TID251"]
# Warehouse clients and pyarrow stay optional, so these imports must stay lazy.
"src/model_finder/sources/*.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
exclude = ["experiments/**"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"
failOnWarnings = false
include = ["src", "demos", "tests"]
exclude = ["**/.venv", "**/__pycache__"]
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportMissingParameterType = false
reportPrivateUsage = false

[tool.deptry]
extend_exclude = ["experiments", "examples", "scripts"]

[tool.deptry.per_rule_ignores]
DEP002 = ["catboost", "duckdb", "joblib", "matplotlib", "optuna", "polars", "scipy", "seaborn", "shap", "statsmodels", "torch", "tqdm", "xgboost", "adbc-driver-manager", "adbc-driver-postgresql", "adbc-driver-snowflake", "adbc-driver-bigquery", "databricks-sql-connector", "redshift-connector"]

[tool.vulture]
paths = ["src", "demos"]
min_confidence = 60
ignore_decorators = ["@model_validator", "@field_validator"]
# The console script and the public helpers that experiment scripts
# call. Vulture sees none of these callers. `make dead` adds every Pydantic field itself.
ignore_names = [
    "Candidates", "classification", "regression", "label", "validate_label_dates",
    "main", "outputs_dir", "work_dir", "scripts_dir", "save_completion",
]

[tool.importlinter]
root_packages = ["model_finder", "demos"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "engine-independent-of-demos"
name = "The engine never imports demos. Fix: pass demo objects in through RunnerConfig."
type = "forbidden"
source_modules = ["model_finder"]
forbidden_modules = ["demos"]

[[tool.importlinter.contracts]]
id = "engine-layers"
name = "CLI above domain above I/O. Fix: move the import up a layer, or pass the value in as an argument."
type = "layers"
containers = ["model_finder"]
exhaustive = true
layers = [
    "cli",
    "completion",
    "labels : rebuild : reseal",
    "final_evaluation : runner",
    "data_audit : validation",
    "sources",
    "run_evidence : holdout : spec",
    "results : ledger",
    "candidates",
    "candidate_result : metrics",
    "splits : feature_provenance",
    "io : paths",
]

[[tool.importlinter.contracts]]
id = "demos-cannot-reach-holdout-store"
name = "Demos do not import the holdout store. Fix: score holdout rows through score_rows and evaluate-final."
type = "forbidden"
source_modules = ["demos"]
forbidden_modules = ["model_finder.holdout", "model_finder.ledger", "model_finder.final_evaluation"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "no-agent-runtime"
name = "The engine and demos import no agent SDK. Fix: remove the import, because the native goal runs the agent."
type = "forbidden"
source_modules = ["model_finder", "demos"]
forbidden_modules = ["anthropic", "openai", "claude_agent_sdk", "claude_code_sdk", "langchain", "litellm"]

[tool.coverage.run]
source = ["model_finder", "demos"]

[tool.coverage.report]
precision = 2
