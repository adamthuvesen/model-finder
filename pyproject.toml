[project]
name = "model-finder"
version = "0.1.0"
description = "Native-goal ML experiment engine with sealed holdouts and a verifiable evidence chain"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Adam Thuvesen" }]
keywords = ["agents", "machine-learning", "experimentation", "offline-evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyarrow>=21.0.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.14.2",
    "sqlglot>=30.29.0",
]

[project.optional-dependencies]
models = [
    "catboost>=1.2.7",
    "duckdb>=1.1.0",
    "joblib>=1.4.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.10.8",
    "optuna>=4.3.0",
    "polars>=1.0.0",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.0",
    "seaborn>=0.13.0",
    "shap>=0.46.0",
    "statsmodels>=0.14.0",
    "tqdm>=4.66.0",
    "xgboost>=3.0.4",
]
# Warehouse ingestion (optional, opt-in per warehouse). The default install stays free of
# warehouse clients; these pull in only when a user installs the extra.
postgres = [
    "adbc-driver-manager>=1.11.0",
    "adbc-driver-postgresql>=1.11.0",
]
snowflake = [
    "adbc-driver-manager>=1.11.0",
    "adbc-driver-snowflake>=1.10.0",
]
bigquery = [
    "adbc-driver-manager>=1.11.0",
    "adbc-driver-bigquery>=1.10.0",
]
databricks = [
    "databricks-sql-connector[pyarrow]>=4.0",
]
redshift = [
    "redshift-connector>=2.1",
]
deep = [
    "model-finder[models]",
    "torch>=2.2.0",
]

[project.scripts]
experiment = "model_finder.cli.main:main"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "ast-grep-cli>=0.51.1",
    "basedpyright==1.40.2",
    "deptry>=0.25.1",
    "import-linter>=2.15",
    "pandas-stubs>=3.1.0.261029",
    "pip-audit>=2.10.1",
    "pre-commit>=4.0.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.4",
    "vulture>=2.16",
    "zizmor>=1.32.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
# A user-level `only-managed` makes uv rebuild .venv on a Python under a custom XDG_DATA_HOME.
python-preference = "managed"
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["model_finder*"]

[tool.setuptools.package-data]
model_finder = [
    "templates/*",
    "hooks/*",
    "sources/bundles/*/*",
    "skills/**/*",
    "contract/*.md",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "BLE", "TRY", "PTH", "TID", "ANN", "PL", "RUF", "C4", "DTZ", "T20", "ARG", "ERA", "PERF", "FBT", "SLF", "RET", "PGH", "PGH003"]
# Line length is enforced by the formatter; don't nag about unsplittable
# strings, URLs, and f-strings.
ignore = ["E501", "TRY003", "PLR2004", "PLR0913", "PLR0917", "ANN401"]

